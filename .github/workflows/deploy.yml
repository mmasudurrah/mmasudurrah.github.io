name: Update

on:
  push:
    branches: [master]
    paths: ['site/**', 'scripts/check_public_site.py', '.github/workflows/deploy.yml']
  pull_request:
    branches: [master]
    paths: ['site/**', 'scripts/check_public_site.py', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check production files and links
        run: python3 scripts/check_public_site.py site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish validated static files
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          branch: gh-pages
          clean: true
          commit-message: Update
